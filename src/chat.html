<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:">
<title>Chat do pet</title>
<style>
  /* tons quentes: laranja terracota + creme */
  :root {
    --fundo: #faf9f5; --texto: #1f1e1d; --suave: #73726c; --borda: #e8e6dc;
    --destaque: #d97757; --destaque-forte: #c6613f; --bolha-eu: #d97757; --bolha-eu-texto: #ffffff; --bolha-pet: #f0eee6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fundo: #262624; --texto: #f5f4ef; --suave: #a6a39a; --borda: #3d3d3a;
      --bolha-pet: #30302e; }
  }
  .ic { width: 18px; height: 18px; display: block; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; font: 14px system-ui, sans-serif; color: var(--texto); overflow: hidden; }

  #painel { display: none; position: absolute; inset: 4px; background: var(--fundo); border-radius: 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,.25); flex-direction: column; overflow: hidden; border: 1px solid var(--borda); }
  body.aberto #painel { display: flex; }

  header { display: flex; align-items: center; gap: 6px; padding: 10px 10px 8px 14px; border-bottom: 1px solid var(--borda); cursor: grab; user-select: none; }
  header h1 { font-size: 15px; margin: 0; flex: 1; }
  header button, .icone { -webkit-app-region: no-drag; background: none; border: none; color: var(--texto);
    cursor: pointer; border-radius: 8px; padding: 5px; display: grid; place-items: center; }
  header button:hover { background: var(--bolha-pet); }
  #pasta { -webkit-app-region: no-drag; font-size: 12px; color: var(--suave); padding: 6px 14px; border-bottom: 1px solid var(--borda);
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
  #pasta .ic { width: 14px; height: 14px; flex: none; }
  #pasta span { overflow: hidden; text-overflow: ellipsis; }
  .info .ic { width: 13px; height: 13px; display: inline-block; vertical-align: -2px; margin-right: 4px; }
  #mensagens::-webkit-scrollbar { width: 8px; }
  #mensagens::-webkit-scrollbar-thumb { background: var(--borda); border-radius: 4px; }
  #pasta:hover { color: var(--texto); }

  #anexos { display: none; gap: 6px; padding: 6px 12px 0; flex-wrap: wrap; }
  #anexos.tem { display: flex; }
  #anexos .anexo { position: relative; }
  #anexos img { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; border: 1px solid var(--borda); display: block; }
  #anexos button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; border: 0; background: var(--destaque-forte); color: #fff; font: bold 12px/18px system-ui, sans-serif; cursor: pointer; padding: 0; }
  .msg.eu .fotos { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
  .msg.eu .fotos img { max-width: 120px; max-height: 120px; border-radius: 8px; display: block; }
  body.soltando #mensagens { outline: 2px dashed var(--destaque); outline-offset: -6px; }
  header, #pasta, form, #anexos { flex: none; }

  #mensagens { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 8px 11px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.35; }
  .pet pre { white-space: pre-wrap; background: var(--fundo); border-radius: 8px; padding: 6px 8px; margin: 4px 0; font-size: 12px; }
  .pet code { background: var(--fundo); border-radius: 4px; padding: 0 3px; font-size: 12px; }
  .eu { align-self: flex-end; background: var(--bolha-eu); color: var(--bolha-eu-texto); border-bottom-right-radius: 4px; }
  .pet { align-self: flex-start; background: var(--bolha-pet); border-bottom-left-radius: 4px; }
  .info { align-self: center; font-size: 12px; color: var(--suave); text-align: center; }
  .erro { align-self: stretch; font-size: 12px; color: #b42318; background: #fde8e8; border-radius: 10px; padding: 8px 10px; white-space: pre-wrap; }
  .permissao { align-self: stretch; border: 1px solid var(--borda); border-radius: 12px; padding: 10px; font-size: 13px; }
  .permissao code { display: block; margin: 6px 0 8px; font-size: 12px; background: var(--bolha-pet); padding: 6px; border-radius: 6px; word-break: break-all;
    white-space: pre-wrap; max-height: 180px; overflow-y: auto; } /* comando inteiro, com rolagem se for grande */
  .permissao button { font: inherit; border-radius: 8px; padding: 4px 12px; cursor: pointer; border: 1px solid var(--borda); background: var(--bolha-pet); color: var(--texto); }
  .permissao button.sim { background: var(--destaque); color: #fff; border-color: transparent; }

  form { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--borda); }
  textarea { flex: 1; resize: none; font: inherit; color: var(--texto); background: var(--bolha-pet); border: 1px solid var(--borda);
    border-radius: 12px; padding: 8px 10px; height: 40px; max-height: 120px; outline: none; }
  form button { border: none; border-radius: 12px; background: var(--destaque); color: #fff; width: 44px; cursor: pointer; display: grid; place-items: center; }
  form button:hover { background: var(--destaque-forte); }
  form button.parar { background: var(--suave); }
</style>
</head>
<body>
<section id="painel">
  <header>
    <h1 id="titulo">Pet</h1>
    <button id="nova" title="Nova conversa"><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z" /></svg></button>
    <button id="btnAjustes" title="Ajustes"><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /><circle cx="12" cy="12" r="3" /></svg></button>
    <button id="fechar" title="Fechar o painel (Esc)"><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m6 9 6 6 6-6" /></svg></button>
  </header>
  <div id="pasta" title="Pasta em que o pet trabalha (clique para trocar)"><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" /></svg><span id="pastaNome">…</span></div>
  <div id="mensagens"></div>
  <div id="anexos"></div>
  <form id="form">
    <textarea id="entrada" placeholder="Fale com o pet… (Ctrl+V cola imagens)" rows="1"></textarea>
    <button id="enviar" type="submit" title="Enviar"><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904z" /><path d="M6 12h16" /></svg></button>
  </form>
</section>
<!-- ícones Lucide (ISC, veja icones/LICENSE-lucide.txt) usados pelo chat.js -->
<template id="icones">
  <span data-icone="enviar"><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904z" /><path d="M6 12h16" /></svg></span>
  <span data-icone="parar"><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect width="18" height="18" x="3" y="3" rx="2" /></svg></span>
  <span data-icone="ferramenta"><svg class="ic" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z" /></svg></span>
</template>
<script src="chat.js"></script>
</body>
</html>
