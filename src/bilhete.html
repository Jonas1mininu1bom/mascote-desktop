<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'self'">
<title>Bilhete</title>
<style>
  html, body { margin: 0; height: 100%; font: 17px "Comic Sans MS", "Segoe Print", system-ui, sans-serif; overflow: hidden; }
  body { background: var(--fundo, #fff8b8); color: var(--texto, #3b3a30); border: 2px solid var(--borda, #e2d36b); box-sizing: border-box; display: flex; flex-direction: column; }
  header { height: 24px; display: flex; justify-content: flex-end; background: var(--topo, #f5e77e); -webkit-app-region: drag; }
  button { -webkit-app-region: no-drag; border: none; background: none; font-size: 16px; cursor: pointer; padding: 0 8px; color: inherit; }
  main { flex: 1; min-height: 0; overflow: hidden; word-break: break-word; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px 14px; }
  img { max-width: 100%; max-height: 110px; }
</style>
</head>
<body>
<header><button id="x" title="Fechar">✕</button></header>
<main id="conteudo"></main>
<script src="bilhete.js"></script>
</body>
</html>
